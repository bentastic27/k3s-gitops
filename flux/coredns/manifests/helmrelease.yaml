apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns
  namespace: flux
spec:
  interval: 10m
  timeout: 5m
  releaseName: coredns
  targetNamespace: coredns
  chart:
    spec:
      chart: coredns
      version: '1.48.2'
      sourceRef:
        kind: HelmRepository
        name: coredns
  # DNS has to be on port 53 of the node. A servicelb/hostPort on 53 DNATs every
  # local address, including the host's systemd-resolved stub (127.0.0.53), so the
  # node loses DNS whenever this pod is down and can't even pull its own image.
  # Instead run on the host network and bind only the node IP.
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: Deployment
          name: coredns
        patch: |
          - op: add
            path: /spec/template/spec/hostNetwork
            value: true
  values:
    isClusterService: false
    serviceType: ClusterIP
    # two host-network pods can't both hold :53, so replace instead of surging
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
    livenessProbe:
      initialDelaySeconds: 15
    servers:
    - zones:
      - zone: .
        use_tcp: true
      port: 53
      plugins:
      - name: bind
        parameters: ${NODE_IP}
      - name: errors
      - name: health
        configBlock: |-
          lameduck 10s
      - name: ready
      - name: hosts
        configBlock: |-
          ${NODE_IP} geo.hivebedrock.network
          ${NODE_IP} hivebedrock.network
          ${NODE_IP} play.inpvp.net
          ${NODE_IP} mco.lbsg.net
          ${NODE_IP} play.galaxite.net
          ${NODE_IP} play.enchanted.gg
          ${NODE_IP} mco.cubecraft.net
          fallthrough
      - name: prometheus
        parameters: 0.0.0.0:9153
      - name: forward
        parameters: . 8.8.8.8:53 8.8.4.4:53
      - name: cache
        parameters: 30
      - name: loop
      - name: reload
      - name: loadbalance
