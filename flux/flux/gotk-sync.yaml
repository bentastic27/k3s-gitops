# Public repo, so flux pulls over anonymous HTTPS (no deploy key or PAT)
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux
  namespace: flux
spec:
  interval: 1m0s
  ref:
    branch: main
  url: https://github.com/bentastic27/k3s-gitops
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux
  namespace: flux
spec:
  interval: 10m0s
  path: ./flux
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux
