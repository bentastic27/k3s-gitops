apiVersion: v1
kind: ConfigMap
metadata:
  name: survival
  namespace: minecraft
  labels:
    app: survival
data:
  EULA: "TRUE" # Must accept EULA to use this minecraft server
  TYPE: PAPER
  PLUGINS: |
    https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
    https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
    https://github.com/ViaVersion/ViaVersion/releases/download/5.12.0/ViaVersion-5.12.0.jar
  MEMORY: 4G
  DIFFICULTY: easy
  VIEW_DISTANCE: "20"
  OPS: |
    bentastic27
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: survival
  namespace: minecraft
spec:
  storageClassName: local-path
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: survival
  name: survival
  namespace: minecraft
spec:
  replicas: 1
  selector:
    matchLabels:
      app: survival
  template:
    metadata:
      labels:
        app: survival
    spec:
      containers:
      - name: main
        image: itzg/minecraft-server:stable
        securityContext:
          runAsUser: 1000
        imagePullPolicy: Always
        resources:
          limits:
            memory: 6Gi
            cpu: 2
        envFrom:
        - configMapRef:
            name: survival
        volumeMounts:
        - mountPath: /data
          name: data
        ports:
        - containerPort: 19132
          protocol: UDP
          name: bedrock
        - containerPort: 25565
          protocol: TCP
          name: java
        readinessProbe: &probe
          exec:
            command:
            - mc-monitor
            - status
          initialDelaySeconds: 30
          failureThreshold: 10
        livenessProbe: *probe
        tty: true
        stdin: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: survival
---
apiVersion: v1
kind: Service
metadata:
  name: survival
  namespace: minecraft
spec:
  selector:
    app: survival
  ports:
  - port: 19132
    protocol: UDP
    name: bedrock
    nodePort: 30132
  - port: 25565
    protocol: TCP
    name: java
    nodePort: 30565
  type: NodePort
